<header>
  <h1>SQUID interactive manual</h1>
  <p class=&quot;sub&quot;>Unofficial fan recreation of the Toraiz SQUID multitrack sequencer (firmware 1.13). Front-panel layout and behaviour from the Operating Instructions + v1.10 addendum; screen text taken from the v1.13 firmware. Not affiliated with Pioneer DJ / AlphaTheta.</p>
</header>
<div class=&quot;bar&quot;>

  <button id=&quot;soundBtn&quot; aria-pressed=&quot;false&quot;>Sound</button>

  <button id=&quot;comboBtn&quot; aria-pressed=&quot;true&quot;>Combo markers</button>
  <button id=&quot;resetBtn&quot;>Reset demo</button>
  <span class=&quot;hint&quot;><span class=&quot;touch&quot;>Tap = press · long-press = hold/latch · drag a knob up/down = turn · tap a control for its tip</span><span class=&quot;desk&quot;>Click = press · right-click or long-press = hold/latch · wheel or drag = turn · <kbd>Space</kbd> play · <kbd>Shift</kbd> SHIFT · <kbd>←</kbd><kbd>→</kbd><kbd>Enter</kbd> selector · <kbd>Esc</kbd> BACK</span></span>
</div>
<div class=&quot;viewbar&quot; role=&quot;group&quot; aria-label=&quot;Panel view&quot;><span>View</span><button data-v=&quot;pads&quot;>Pads</button><button data-v=&quot;controls&quot;>Controls</button><button data-v=&quot;full&quot;>Whole</button></div>
<div id=&quot;deviceWrap&quot;><svg id=&quot;device&quot; viewBox=&quot;36 56 1278 766&quot; role=&quot;application&quot; aria-label=&quot;SQUID front panel&quot;></svg></div>
<main>
  <section class=&quot;card&quot; id=&quot;info&quot; aria-live=&quot;polite&quot;></section>
  <section>
    <div class=&quot;card&quot; id=&quot;tourBox&quot; hidden></div>
    <div class=&quot;card&quot; id=&quot;comboCard&quot;>
      <h2>Button combinations</h2>
      <p class=&quot;pg&quot;>Right-click or long-press (latch) any control marked <b style=&quot;color:var(--combo)&quot;>+</b>, or hold a pad, and the controls it combines with light up blue; hover one to read the combo. Hover a row below to see both controls, click Show to watch it.</p>
      <input id=&quot;comboQ&quot; type=&quot;search&quot; placeholder=&quot;Filter, e.g. pad, loop, delete, mirror&quot; aria-label=&quot;Filter combinations&quot;>
      <div id=&quot;comboList&quot;></div>
    </div>
    <div class=&quot;card&quot; style=&quot;margin-top:16px&quot;>
      <h2>About this simulation</h2>
      <p>The screen, menus, pad modes, step editing, pattern sets, mutes, copy/paste, interpolation, randomizer, running direction, speed and rhythmic controls, trigger probability and speed modulation all work. Turn on <b>Sound</b> to hear it through a built-in drum kit and synths, or pick one of the <b>Example projects</b>.</p>
      <details><summary>Simplified or not simulated</summary>
        <ul class=&quot;tight&quot;>
          <li>No MIDI/CV/sync output; the rear jacks are labels only.</li>
          <li>Sounds are a built-in drum kit and simple synths standing in for whatever the real tracks would drive over MIDI/CV. Drum tracks use the General MIDI drum map (36 kick, 38 snare, 42 closed hat…).</li><li>Swing delays the audio of even steps; the pads still light on the grid. Groove Bend shifts the current track only.</li>
          <li>Arpeggiator, Note Repeat and real-time automation recording are display-only.</li>
          <li>Chord-mode voicings and default Harmonizer chords are illustrative; the 18 chord set <i>names</i> come from the firmware.</li>
          <li>Time Warp shows the mode and pad layout but doesn't record.</li>
          <li>Skip-back direction is approximated (two steps forward, one back).</li>
          <li>Projects: Create New and Restore Demo work; other file operations only show their screens.</li>
        </ul>
      </details>
      <p class=&quot;pg&quot;>Sources: SQUID Operating Instructions (fw 1.0), v1.10 Addendum, v1.13 change history, string tables from <code>trzis1__v113.bin</code>. Wish-list items from <code>feature-requests.md</code>.</p>
    </div>
  </section>
</main>

function order16(dir,mir){
  let o;
  switch(dir){
    case &quot;dDown&quot;:o=[0,4,8,12,1,5,9,13,2,6,10,14,3,7,11,15];break;
    case &quot;dZig&quot;:o=[0,1,2,3,7,6,5,4,8,9,10,11,15,14,13,12];break;
    case &quot;dCw&quot;:o=[0,1,2,3,7,11,15,14,13,12,8,4,5,6,10,9];break;
    case &quot;dCcw&quot;:o=[0,4,8,12,13,14,15,11,7,3,2,1,5,9,10,6];break;
    case &quot;dSkip&quot;:o=[0,1,2,1,2,3,4,5,6,5,6,7,8,9,10,9,10,11,12,13,14,13,14,15];break; // approximation: 2 forward, 1 back
    default:o=range(0,15,Number);
  }
  return mir?o.map(i=>i-(i%4)+3-(i%4)):o;
}
function sequence(p){
  const pages=p.pages;let seq=[];
  for(let pg=0;pg<pages;pg++)seq=seq.concat(order16(S.dir,S.mirror).map(i=>pg*16+i));
  seq=seq.filter(i=>p.steps[i].act);
  if(!seq.length)return [];
  if(S.rev)seq.reverse();
  if(S.sb&amp;&amp;seq.length>2)seq=seq.concat(seq.slice(1,-1).reverse());
  return seq;
}

let lastT=performance.now();
function speedMod(phase){
  if(!S.depth)return 1;const x=(phase%S.modLen)/S.modLen;
  const w=[x<.5?4*x-1:3-4*x,x<.5?1-4*x:4*x-3,Math.sin(2*Math.PI*x),Math.cos(2*Math.PI*x),2*x-1,x<.5?1:-1][S.shape];

// advance() runs from both rAF and a 10 ms worker clock, so sequencing keeps time when frames drop or the tab is hidden
let tickNow=0;
function advance(now){
  const dt=Math.min(now-lastT,100);if(dt<=0)return;
  lastT=now;tickNow=now;
  if(S.playing&amp;&amp;!S.paused){
    const base=dt*S.bpm/60*4/1000;
    S.gphase+=base;
    const bar=Math.floor(S.gphase/16);
    if(bar!==S.lastBar){S.lastBar=bar;S.tracks.forEach(t=>{if(t.queued!==null){t.cur=t.queued;t.queued=null;t.lastKey=null}});if(S.setQueued!=null){applySet(S.setQueued);S.setQueued=null}}
    S.beat=Math.floor(S.gphase/4)%4;
    S.tracks.forEach((t,ti)=>{
      const p=t.pats[t.cur];if(!p)return;
      let m=SPEEDV[p.speed]*speedMod(t.phase);
      if(ti===S.track){if(isHeld(&quot;half&quot;))m*=.5;if(isHeld(&quot;dbl&quot;))m*=2}
      t.phase+=base*m;
      advanceTrack(t,ti,p,S.bpm/60*4/1000*m,base*m);
    });
    if(S.tw)S.twLen=Math.min(256,S.twLen+base);
  }
}

  else if(id===&quot;depth&quot;){const b=S.depth;S.depth=Math.max(-64,Math.min(63,S.depth+d));popup(&quot;Depth&quot;,String(b),&quot;&quot;,String(S.depth))}
  else if(id===&quot;scaleK&quot;){if(sh){useShift();const b=S.key;S.key=(S.key+d+12)%12;popup(&quot;Key&quot;,NOTE[b],&quot;&quot;,NOTE[S.key])}else{const b=S.scale;S.scale=Math.max(0,Math.min(SCALES.length-1,S.scale+d));popup(&quot;Scale&quot;,SCALES[b][0],&quot;&quot;,SCALES[S.scale][0])}emit(&quot;scale&quot;)}

function stepKnob(k,d,sh){

<header>
  <h1>Blackbox interactive manual</h1>
  <p class=&quot;sub&quot;>Unofficial, playable recreation of the 1010music Blackbox (firmware 3.0), built from the Blackbox 3.0 User Manual, with an optional layer for the community <b>blackbox-mod 3.1.n</b>. All sounds are synthesized in your browser; no 1010music samples, firmware or artwork are used. Not affiliated with 1010music.</p>

      <p>Pads (Sample, Multi-sample, Clip, Slicer, Granular), ADSR, filter, LFO and modulation, the 16×4 sequencer with piano roll, probability and velocity, Song scenes with Keep and Grab, both effects, the 4-band EQ, mixer and mutes, presets and the Tools pages all work. You can record from your microphone or resample the output, and import your own samples.</p>

        <ul class=&quot;tight&quot;>
          <li>One stereo output; Out 1/2/3 are mixed together. The rear jacks, CV and analog clock are labels only.</li>
          <li>Sounds are synthesized stand-ins for the factory library; folder names are invented.</li>
          <li>Slicer Sync, MID file import, New Multi (automated multi-sample recording), Pack, Clean and SD Mode only show their screens or a message.</li>
          <li>Presets you save live in this browser (localStorage); recorded and imported audio lasts for the session only.</li>
          <li>Pinch-zoom on the waveform and piano roll is the mouse wheel here.</li>
          <li>Mod layer: Munchi granular delay falls back to the stock delay; Fidelity machine modes are approximations.</li>

/* ================= sound library: synthesized in OfflineAudioContexts ================= */
const SR=44100;
let NZ=null;
function ren(dur,fn){const c=new OfflineAudioContext(1,Math.ceil(dur*SR),SR);if(!NZ){NZ=new Float32Array(SR*2);for(let i=0;i<NZ.length;i++)NZ[i]=Math.random()*2-1}
  const nb=c.createBuffer(1,NZ.length,SR);nb.copyToChannel(NZ,0);const out=c.createGain();out.gain.value=.9;out.connect(c.destination);fn({c,nb,out});return c.startRendering()}
function O(K,type,f,t,e){const o=K.c.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);o.start(t);o.stop(e);return o}

function ctlText(id){const s=SCR[S.scr];if(/^k\d/.test(id)){const j=+id[1]-1,kk=s.k()[j];return[KNAMES[j],kk[0]===&quot;—&quot;?&quot;Does nothing on this screen.&quot;:`<b style=&quot;display:inline&quot;>${kk[0]}</b>: ${kk[1]}`,&quot;knobs: p. 23–25, 70, 84&quot;]}
 const inf=INFO[id];if(id===&quot;info&quot;)return[inf[0],inf[1]+`<div class='s'><em>Here:</em> ${s.i}</div>`,inf[2]];if(id===&quot;back&quot;)return[inf[0],inf[1]+(s.b&amp;&amp;s.b!==&quot;—&quot;?`<div class='s'><em>Here:</em> ${s.b}</div>`:&quot;&quot;),inf[2]];return inf}
function showTip(id,e){const[n,d]=ctlText(id);tipHtml(`<b>${n}</b>${d}${MODTIP[id]&amp;&amp;MOD()?`<div class=&quot;m&quot;>blackbox-mod: ${MODTIP[id]}</div>`:&quot;&quot;}`,e)}
function tipHtml(h,e){const tip=$(&quot;#tip&quot;);tip.innerHTML=h;tip.hidden=false;moveTip(e)}
function moveTip(e){const tip=$(&quot;#tip&quot;);if(tip.hidden)return;const w=tip.offsetWidth,h=tip.offsetHeight;let x=e.clientX+14,y=e.clientY+16;if(e.pointerType&amp;&amp;e.pointerType!==&quot;mouse&quot;){x=e.clientX-w/2;y=e.clientY-h-36;if(y<8)y=e.clientY+36}
 if(x+w>innerWidth-8)x=innerWidth-w-8;if(y+h>innerHeight-8)y=e.clientY-h-12;tip.style.left=Math.max(8,x)+&quot;px&quot;;tip.style.top=Math.max(8,y)+&quot;px&quot;}
function hideTip(){$(&quot;#tip&quot;).hidden=true}
const MODTIP={mix:&quot;MIX now cycles Mixer → Mute → Solo.&quot;,keys:&quot;The top-right knob picks a chord shape on the Keys screen.&quot;,seqs:&quot;Notes added just ahead of the playhead play on that pass; Event PLAY gains 1:2 … 8:8 conditions.&quot;,
 fx:&quot;Reverb Type (Plate/Room) and Delay Type (Delay/Munchi) on the effect pages.&quot;,tools:&quot;Master compressor models and Comp Thresh on Tools → Main.&quot;,pads:&quot;Fidelity machine modes, 24 dB filter, slicer knobs, pad-1 ducker sources.&quot;};
const MODN={mix:&quot;MIX (or INFO) cycles Mixer → Mute → <b>Solo</b>. Known issue: un-soloed pads can stay muted; unmute them in Mute mode.&quot;,
 wave:&quot;On a Slicer pad: bottom-left knob = slice Start, bottom-right = slice End, top-right = Zoom.&quot;,keys:&quot;Top-right knob picks a chord shape (Tri, 7th, 9th, Su2, Su4, 6th, Ad9, Pwr, Oct, Opn, Shl, Qrt, m7, m9, Mj7). In-scale shapes follow the grid's Scale/Root. Chords record into sequences; they need the pad out of Mono.&quot;,
 roll:&quot;Event mode: turn PLAY past 100% for conditions 1:2 … 8:8 (play on the A-th of every B loops).&quot;,params:&quot;Conf → <b>Fidelity</b> replaces Interp (crunch + SP1200/SP-12/S950/MPC60/SP Raw). The filter becomes 24 dB/oct with drive past noon on Res.&quot;,
 mod:&quot;Extra sources EXP1, EXP2, PUMP, LINR fire when pad 1 plays: put a negative Amount on another pad's Level for sidechain pumping.&quot;,fxp:&quot;Type comes first. Delay: the stock 7 settings. Munchi (CHOMPI TEMPO granular delay): Wand, Random, Feedback, Freeze, Clock, Width, Duck. Reverb: Plate, or Room with Size, Mod, Early, Width. Munchi and Room are approximations here.&quot;,
 tools:&quot;Main page: Compressor is now a list (Off, Stock, Glue, Punch, Opto, Squash, Limit) and Comp Thresh (−24…+12 dB), both right under Headphone. Version shows 3.1.n.&quot;,seqs:&quot;Sequencer fix: a note added just ahead of the playhead plays on that pass.&quot;};
function showInfo(id){const[n,d,pg]=ctlText(id);$(&quot;#info&quot;).innerHTML=`<div class=&quot;crumb&quot;>Control</div><h2>${n}</h2><p>${d}</p>${MODTIP[id]&amp;&amp;MOD()?`<div class=&quot;modbox&quot;><b>blackbox-mod:</b> ${MODTIP[id]}</div>`:&quot;&quot;}<p class=&quot;pg&quot;>Manual ${pg}</p>`;infoSig=&quot;ctl:&quot;+id+S.scr}
let infoSig=&quot;&quot;;
function screenSig(){const s=SCR[S.scr];return S.scr+&quot;|&quot;+s.t+&quot;|&quot;+s.k().map(k=>k[0]).join()+&quot;|&quot;+MOD()}
function renderScreenInfo(){const s=SCR[S.scr],kk=s.k();
 $(&quot;#info&quot;).innerHTML=`<div class=&quot;crumb&quot;>You are here: <b>${s.path}</b></div><h2>${s.t}</h2><p>${s.d}</p>
 <div class=&quot;kmap&quot;>${kk.map((k,j)=>`<div><b>${KNAMES[j]}</b>${k[0]===&quot;—&quot;?&quot;—&quot;:`${k[0]}: ${k[1]}`}</div>`).join(&quot;&quot;)}<div class=&quot;wide&quot;><b>INFO / BACK</b>INFO: ${s.i} · BACK: ${s.b}</div></div>
 ${MOD()&amp;&amp;MODN[S.scr]?`<div class=&quot;modbox&quot;><b>blackbox-mod:</b> ${MODN[S.scr]}</div>`:&quot;&quot;}<p class=&quot;pg&quot;>Manual p. ${s.pg} · hover anything on the screen for what it means</p>`;infoSig=screenSig()}
let lastScr=&quot;&quot;;
function maybeInfo(){if(S.scr!==lastScr||(infoSig.startsWith(lastScr+&quot;|&quot;)&amp;&amp;infoSig!==screenSig())){lastScr=S.scr;if(!infoLock||infoLock!==S.scr)renderScreenInfo();infoLock=null}}
let infoLock=null;
function introInfo(){$(&quot;#info&quot;).innerHTML=`<h2>Start here</h2><p>This is a working Blackbox. The <b>touchscreen</b> responds to clicks and drags, the <b>knobs</b> to the mouse wheel or dragging, and the buttons below the screen switch between its areas, left to right in the order you'd usually build a track.</p>
 <h3>Try</h3><ul class=&quot;tight&quot;><li>Touch some pads. Pink = selected, blue bar = playing.</li><li>Push <b>SEQS</b>, then <b>PLAY</b>: four sequences of the loaded preset play. Touch cells to turn them on and off.</li><li>Push <b>INFO</b> anywhere to dig deeper; <b>BACK</b> returns.</li><li>The pink labels next to the knobs always say what they do on the current screen.</li></ul>
 <p>Pick a <b>guided tour</b> above, or use the chapter list below to jump to any part of the manual.</p>`;infoSig=&quot;intro&quot;;lastScr=S.scr}
const HISTS={wave:[&quot;pads&quot;],params:[&quot;pads&quot;,&quot;wave&quot;],mod:[&quot;pads&quot;,&quot;wave&quot;,&quot;params&quot;],load:[&quot;pads&quot;],browse:[&quot;pads&quot;,&quot;wave&quot;],roll:[&quot;seqs&quot;],seqp:[&quot;seqs&quot;,&quot;roll&quot;],scene:[&quot;song&quot;],fxp:[&quot;fx&quot;]};
function setScr(s){S.ov=null;S.scr=s;S.hist=[...(HISTS[s]||[])];emit(&quot;scr:&quot;+s)}
const findPad=f=>{const i=S.pads.findIndex(f);if(i>=0)S.pad=i;return i};
const tb=(rows)=>`<table class=&quot;t&quot;>${rows.map(r=>`<tr>${r.map((c,j)=>j?`<td>${c}</td>`:`<th>${c}</th>`).join(&quot;&quot;)}</tr>`).join(&quot;&quot;)}</table>`;
const CHAP=[
 [&quot;Setting up, outputs and volume&quot;,&quot;9–11&quot;,()=>{setScr(&quot;tools&quot;);S.toolTab=&quot;Main&quot;;S.toolRow=0},`<p>The Blackbox runs off a 2 A USB supply and stores everything on the microSD card. There are three stereo outputs plus PHONES; PHONES always carries everything. Outputs are at Eurorack level (±5 V), louder than line level, so turn it down if it distorts.</p><p>Volume lives on <b>TOOLS → Main</b>: top knob picks Headphone or an Out Vol, bottom knob sets it.</p>`],
 [&quot;Overview: the controls&quot;,&quot;12–13&quot;,()=>setScr(&quot;pads&quot;),`<p>White buttons choose the area (PADS → KEYS → SEQS → SONG → FX → MIX, then PSET and TOOLS). Black buttons REC, STOP, PLAY run the transport. The screen and the four knobs do everything else; INFO drills in, BACK goes back.</p><p>The black bar at the top shows bar:beat, the recording context (sequence, or scene in Song mode) and a progress bar.</p>`],
 [&quot;Quick start&quot;,&quot;14–19&quot;,()=>{setScr(&quot;pset&quot;);startTour(0)},`<p>Load a preset from PSET, play pads, look at Keys, play sequences, then songs. The Quick start tour walks through it.</p>`],
 [&quot;Screen navigation map&quot;,&quot;20&quot;,()=>setScr(&quot;pads&quot;),`<p>How the screens connect (button → screen, I = INFO, B = BACK):</p>${tb([[&quot;PADS&quot;,&quot;Pads →I Waveform →I Pad Parameters →I Modulation; empty pad →I Load and Record&quot;],[&quot;KEYS&quot;,&quot;Keys ↔ KEYS ↔ Grid&quot;],[&quot;SEQS&quot;,&quot;Sequences →I Piano Roll →I Seq Params (Seq, A–D)&quot;],[&quot;SONG&quot;,&quot;Song Scenes →I Scene Parameters&quot;],[&quot;FX&quot;,&quot;FX →I FX Parameters →I FX Modulation; FX ↔ FX ↔ EQ&quot;],[&quot;MIX&quot;,&quot;Mix ↔ MIX/INFO ↔ Mute&quot;],[&quot;PSET / TOOLS&quot;,&quot;Presets / Tools&quot;]])}`],
 [&quot;Pads and pad modes&quot;,&quot;21–22&quot;,()=>setScr(&quot;pads&quot;),`<p>Each pad holds a WAV (or a folder) and has a mode:</p>${tb([[&quot;Sample&quot;,&quot;One-shots and melodies; start/end, loops (forward, bidirectional), reverse. 16-voice pool.&quot;],[&quot;Multi-sample&quot;,&quot;A folder spread across the keyboard by root note.&quot;],[&quot;Clip&quot;,&quot;Tempo-synced loops; only plays while the clock runs; 2 voices.&quot;],[&quot;Slicer&quot;,&quot;Trigger sections of one file; 2 voices.&quot;],[&quot;Granular&quot;,&quot;Tiny grains (10–200 ms) for textures; mono.&quot;],[&quot;New Recording&quot;,&quot;Clear the pad / record a new WAV.&quot;]])}<p>Select a pad, push INFO: empty pads open Load and Record, loaded pads the Waveform screen.</p>`],
 [&quot;The Waveform screen&quot;,&quot;23–24&quot;,()=>{findPad(p=>p.mode===&quot;sample&quot;&amp;&amp;p.w&amp;&amp;!p.multi);setScr(&quot;wave&quot;)},`<p>Overview on top, zoomable detail below. Pink bracket = Start + Length, white bracket = Loop Start → Loop End (loop points needn't be inside Start/End). Knobs: top = Start/Length, bottom = loop points. The top bar has the pad selector, the Pad Mode selector, the WAV name (touch to change file) and a trigger button.</p>`],
 [&quot;Pad parameters&quot;,&quot;25, 27–30&quot;,()=>{setScr(&quot;params&quot;);S.ptab=&quot;Main&quot;},`<p>Pages: <b>Main</b> (Level, Pitch, Filter, Res, ADSR), <b>Pos</b> (mode-specific), <b>LFO</b>, <b>Conf</b> (Launch, Output, Pan, Poly, Excl Group, MIDI In, Pad Note…).</p><p>Knob pages: tap a knob to move the pink focus frame; the four hardware knobs adjust the four knobs inside it. List pages: top knobs choose the row, bottom knobs the value.</p>${tb([[&quot;Launch&quot;,&quot;Trigger plays through; Gate stops on release; Toggle stops on the next trigger&quot;],[&quot;Excl Group&quot;,&quot;Pads in the same group choke each other&quot;],[&quot;Poly Mode&quot;,&quot;Mono…Poly 8; use the lowest you need&quot;]])}`],
 [&quot;Modulation&quot;,&quot;26, 30, 98–100&quot;,()=>{setScr(&quot;params&quot;);S.ptab=&quot;Main&quot;;S.psel=0;S.pfocus=0},`<p>Any parameter with a 3-segment bar can be modulated. Select it, push INFO: three slots of Source + Amount. Sources: LFO, VEL (velocity, on Level by default), PTCH, MODW, MVOL, MPAN or a learned MIDI CC. A CC maps its range to value ± Amount (Filter 20% with 15% amount → 5%…35%). Max 8 CC mappings per pad.</p>`],
 [&quot;Sample pads and loop fade&quot;,&quot;31–34&quot;,()=>{findPad(p=>p.mode===&quot;sample&quot;&amp;&amp;p.w&amp;&amp;!p.multi);setScr(&quot;params&quot;);S.ptab=&quot;Pos&quot;},`<p>Pos page: Loop Mode (None / Forward / Bidirect), Loop Fade, Reverse, Start, Length, Loop Start, Loop End. In Trigger mode a looping sample loops through its release; Gate loops while held; Toggle until the next trigger.</p><p><b>Loop Fade</b> cross-fades the audio just before Loop Start into the end of the loop (a percentage of the loop length) to hide the click. It needs audio before Loop Start to borrow.</p>`],
 [&quot;Multi-sample pads&quot;,&quot;35–37&quot;,()=>{findPad(p=>p.multi);setScr(&quot;wave&quot;)},`<p>Put the samples for one instrument in their own folder, open the WAV selector, highlight a file in it and choose <b>File → Load All</b>. Files map by their root notes; without root notes they map alphabetically from C2 up (great for drum kits). Limits: 64 WAVs per pad, 80 loaded at once. Only Main, LFO and Conf pages apply.</p>`],
 [&quot;Clip pads&quot;,&quot;38–41&quot;,()=>{findPad(p=>p.mode===&quot;clip&quot;);setScr(&quot;params&quot;);S.ptab=&quot;Pos&quot;},`<p>For loops synced to the clock. Clips only play while PLAY is running; touching one before that arms it (white bar). Pos page: Loop, Beat Count (Auto reads an ACID tag or guesses), Quant Size (start/stop on the next boundary) and <b>Sync</b>, which jumps the playback back into line every unit so a clip at a slightly different tempo can't drift.</p><p>Try it: load BB LOFI HIP HOP, start the Keys 90 clip, then change the tempo on the SONG screen.</p>`],
 [&quot;Slicer pads&quot;,&quot;41–44&quot;,()=>{findPad(p=>p.mode===&quot;slicer&quot;);setScr(&quot;wave&quot;)},`<p>Play sections of one file independently. On the Waveform screen touch <b>…</b>: Split adds a slice at the white cursor, Join removes one, Scan detects hits (lower threshold = more slices), Grid divides evenly. Pos page: Slice (which one plays), Slice Seq (Forward, Backwards, Random, Stagger), PlayThru, Loop.</p><p>On KEYS, C2 = slice 1, C#2 = slice 2…; the grid shows numbered slices.</p>`],
 [&quot;Granular pads&quot;,&quot;45&quot;,()=>{findPad(p=>p.mode===&quot;gran&quot;);setScr(&quot;params&quot;);S.ptab=&quot;Pos&quot;},`<p>Plays the sample as overlapping grains. Grain Size (≈20 ms–1 s), Density (above 50% grains overlap), Scatter, Speed (100% = original, 0% freezes), Window (how far from the play position grains are picked) and Pan Rnd. More grains = more CPU.</p>`],
 [&quot;Recording samples&quot;,&quot;46–50&quot;,()=>{findPad(p=>!p.w&amp;&amp;!p.multi);setScr(&quot;load&quot;)},`<p>Select an empty pad, INFO. Set Rec Input (L+R, Left, Right, or <b>Resam</b> = record Out 1 including effects), Gain, Length (Custom = until STOP), Rec Quant, monitoring and threshold. Hold REC and press PLAY. With Lead In on, it counts 4 beats first. New files go to \\Presets\\<i>preset name</i> as RC000001.wav…</p><p>In this simulation L+R uses your microphone (the browser will ask).</p>`],
 [&quot;Trim, clipboard and WAV files&quot;,&quot;57–61&quot;,()=>setScr(&quot;pads&quot;),`<p><b>Trim</b>: set the pink bracket on the Waveform screen, then WAV selector → File → Trim (destructive). <b>Clipboard</b>: turn the bottom-right knob on the Pads screen for Cut / Copy / Paste / Clear. File → Delete, Save As, Rename manage files on the card. WAVs can be 16/24/32-bit, mono or stereo, any rate (48 kHz preferred).</p>`],
 [&quot;Keys&quot;,&quot;62–65&quot;,()=>{setScr(&quot;keys&quot;)},`<p>KEYS plays the selected pad chromatically (C4 = original pitch, or the Root Note). Push KEYS again for the grid: four octaves of one scale, root and scale at the top right. The pad selector (top-left grid) picks the pad, or SEQ to play into the selected sequence. Your computer keyboard plays the piano here (A W S E D F…).</p>`],
 [&quot;Sequences&quot;,&quot;15, 66–69&quot;,()=>setScr(&quot;seqs&quot;),`<p>16 cells × 4 patterns (A–D). All patterns of a cell share mode (Pads, Keys, MIDI), target and quantization; each pattern has its own Step Len (1/64 … 8 bars) and Step Count (1–256).</p><p><b>To record</b>: select a cell, go to PADS or KEYS, hold REC and press PLAY, play. REC again stops recording but keeps playing; STOP stops. Recording overdubs. Bottom-right knob on the grid swaps UNDO/CLEAR/OFF for the pattern selector.</p>`],
 [&quot;Piano roll, velocity and probability&quot;,&quot;70–76&quot;,()=>setScr(&quot;roll&quot;),`<p>INFO on a sequence. Knobs: top-left select note, top-right length, bottom-left move, bottom-right pitch. Wheel/drag scroll. <b>Event</b> turns the bottom knobs into VEL and PLAY (probability). <b>Edit</b>: Cut, Copy, Paste (adds notes), Clear, Double (copies the pattern into a doubled length), Import (.MID).</p><p>INFO again: Duty Cycle, Quant Size, Step Mode (snap recorded notes), MIDI OUT; and per pattern Step Len / Step Count.</p>`],
 [&quot;Songs, scenes and Keep&quot;,&quot;77–80&quot;,()=>setScr(&quot;song&quot;),`<p>Up to 32 scenes. Each fires some pads at its start and plays chosen patterns, repeated Play Count times (M × N). Song button = Song Mode; Loop = off / Loop1 / LoopA. Touching a scene during playback queues it for the next bar.</p><p><b>Keep</b> (new in 3.0) leaves a pad or sequence as it is across a scene change. <b>Grab</b> stores whatever is playing now into the selected scene. Reordering = Add, Cut, Paste.</p>`],
 [&quot;Effects&quot;,&quot;81–83&quot;,()=>setScr(&quot;fx&quot;),`<p>Two shared effects, FX1 Delay and FX2 Reverb, fed by per-pad sends (top knobs on the FX screen). Wet signal goes to Out 1. Touch FX1/FX2, INFO for the parameters; INFO again on a knob to modulate it. The reverb is the most CPU-hungry thing on the box.</p>${tb([[&quot;Delay&quot;,&quot;Delay (note value with Beat), Feedback, Cutoff/Width filter, Beat, Filter, Ping&quot;],[&quot;Reverb&quot;,&quot;Decay, Damping, Predelay&quot;]])}`],
 [&quot;EQ&quot;,&quot;84–85&quot;,()=>setScr(&quot;eq&quot;),`<p>Push FX twice. A 4-band EQ on the master output: INFO selects a band; knobs set Gain, Frequency, Q and Type (None, L Cut, L Shelf, Param, H Shelf, H Cut). Touch or drag the grid to move the selected point.</p>`],
 [&quot;Mixer and mutes&quot;,&quot;86&quot;,()=>setScr(&quot;mix&quot;),`<p>Top knobs = level, bottom knobs = pan of the selected pad. Push MIX again or INFO for Mute mode (green = on, red = muted). Mutes aren't saved with the preset.</p>`],
 [&quot;Presets&quot;,&quot;18–19, 87–93&quot;,()=>setScr(&quot;pset&quot;),`<p>A preset holds pads, sequences, scenes, effects and mixer settings. Nothing saves automatically: PSET → Save. File: New, Save As, Rename, Delete, <b>Pack</b> (copy all used WAVs into the preset folder so it can't break), <b>Clean</b> (delete unused WAVs from it). Presets live in \\Presets\\<i>name</i>\\preset.xml.</p>`],
 [&quot;Tools&quot;,&quot;94–95&quot;,()=>setScr(&quot;tools&quot;),`<p>Global settings. Main: volumes, brightness, metronome, master compressor, SD mode. Rec: RecToPlay, RecConfig (Global/Per Pad), Lead In. MIDI: Global In, MIDI Seq, PGM In, Pad Record, MIDI Out, USB Dev Out. Clock: Receive, Send, Analog In/Out PPQ.</p>`],
 [&quot;MIDI out: sequences (SEQS)&quot;,&quot;72–73, 93, 109–111&quot;,()=>{const m=S.seqs.findIndex(q=>q.mode===&quot;midi&quot;);if(m>=0)S.seq=m;setScr(&quot;seqp&quot;);S.seqTab=&quot;Seq&quot;;S.seqRow=3},`<p>All MIDI out comes from sequences, so the MIDI choices live under <b>SEQS</b>:</p>${tb([[&quot;SEQS → INFO&quot;,&quot;Piano roll: the mode button (top left) picks PADS, KEYS or MIDI. A MIDI sequence plays no sound inside the Blackbox, it only sends notes.&quot;],[&quot;SEQS → INFO → INFO, Seq tab&quot;,&quot;<b>MIDI OUT</b>: None or Ch1–16, the channel this sequence sends on. Set it to your instrument's channel.&quot;],[&quot;KEYS → pad selector → SEQ&quot;,&quot;Keys play into the selected sequence: a MIDI sequence sends them straight out, a Keys sequence plays its pad and sends MIDI on playback.&quot;],[&quot;Piano roll → Edit → Import&quot;,&quot;Load a .MID file into the selected pattern; it plays out on the sequence's MIDI OUT channel.&quot;]])}<p>To double a pad on an external synth: make a Keys sequence for that pad and give it a MIDI OUT channel. To record from a controller, set TOOLS → MIDI → <b>MIDI Seq</b> to the controller's channel; notes go into the selected Keys/MIDI sequence and through to its MIDI OUT. Show opens the Seq tab (of a MIDI sequence, if the preset has one). The <i>MIDI internal</i> tour walks through it.</p>`],
 [&quot;MIDI in (TOOLS)&quot;,&quot;96–108&quot;,()=>{setScr(&quot;tools&quot;);S.toolTab=&quot;MIDI&quot;},`<p>Global In note map (C4 = 60):</p>${tb([[&quot;2–33&quot;,&quot;Trigger scenes 1–32&quot;],[&quot;34 / 35&quot;,&quot;Previous / next scene&quot;],[&quot;36–51&quot;,&quot;Play pads (bottom-left first)&quot;],[&quot;52–67&quot;,&quot;Toggle sequences&quot;],[&quot;68–83&quot;,&quot;Record into pads (Pad Record on)&quot;],[&quot;84–99&quot;,&quot;Clear pads&quot;],[&quot;100–104&quot;,&quot;Prev pad, next pad, play, record, clear selected&quot;]])}<p>A pad's own MIDI In channel plays it chromatically. MIDI Seq records into Keys/MIDI sequences. MIDI out always comes from sequences. Click <b>MIDI</b> in the toolbar to use a real controller here.</p>`],
 [&quot;Clock and tap tempo&quot;,&quot;112–114&quot;,()=>setScr(&quot;song&quot;),`<p>Clock priority: CLOCK IN jack, then MIDI clock (USB or TRS), then the internal clock. PLAY resets to 1:1. On the SONG screen the top-left knob sets the tempo, or tap the tempo box in time.</p>`],
 [&quot;Templates, HighQ and CPU tips&quot;,&quot;116–118&quot;,()=>{setScr(&quot;params&quot;);S.ptab=&quot;Conf&quot;},`<p>A template is a preset whose pads are configured but empty. HighQ interpolation reduces aliasing when playing pads chromatically, at a CPU cost. To avoid crackles: use Mono where you can, avoid the reverb, prefer mono 48 kHz samples, fewer grains.</p>`],
 [&quot;Sleep, firmware and specs&quot;,&quot;118–121&quot;,()=>setScr(&quot;tools&quot;),`<p>Hold BACK for 3 s to sleep; any button wakes it (try it here). Firmware: copy blackbox.bin to the card, hold BACK + INFO while plugging in power. Specs: 64 MB RAM cache, samples stream from the card (up to 4 GB), 32 voices total, 24-bit converters.</p>`]];
function chapterShow(i){const[t,pg,fn,html]=CHAP[i];fn();infoLock=S.scr;lastScr=&quot;&quot;;$(&quot;#info&quot;).innerHTML=`<div class=&quot;crumb&quot;>Manual chapter · p. ${pg}</div><h2>${t}</h2>${html}<p><button class=&quot;sm&quot; id=&quot;scrInfo&quot;>What's on this screen?</button></p>`;$(&quot;#scrInfo&quot;).onclick=renderScreenInfo;
 $(&quot;#info&quot;).scrollIntoView({behavior:&quot;smooth&quot;,block:&quot;nearest&quot;})}

/* ================= blackbox-mod card ================= */

function renderModCard(){const c=$(&quot;#modCard&quot;);c.hidden=!MOD();if(!MOD())return;c.innerHTML=`<h2 style=&quot;color:var(--mod)&quot;>blackbox-mod 3.1.n layer</h2><p class=&quot;pg&quot;>Community firmware mod for the original Blackbox, built on stock 3.1.9 (this manual covers 3.0). Not from 1010music. Amber M markers show affected buttons.</p>
 <p class=&quot;pg&quot;>Video walkthrough by the mod's author: <a href=&quot;https://www.youtube.com/watch?v=XQJCY2Asl0s&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;>The Blackbox OG Just Got SP-1200 Mode, Chords and Sidechain</a>. Each feature has a guided tour (Guided tours → Mod: …).</p>
 <ul class=&quot;chap&quot;>${MODF.map((m,i)=>`<li><span><b>${m[0]}</b> ${m[1]}</span><button data-m=&quot;${i}&quot;>Show</button></li>`).join(&quot;&quot;)}</ul>
 <details><summary>Not shown, and known issues</summary><ul class=&quot;tight&quot;><li>Munchi is approximated: a tempo delay that feeds the reverb (Wand right), jumps its time at random (Wand left) and freezes; no reverse/octave glitches, no Duck. Room ignores Mod.</li><li>Solo can stick: pads may stay muted after un-soloing.</li><li>Chords need the pad out of Mono.</li><li>Install: patch your own BLACKBOX.bin 3.1.9, then BACK + INFO at power-on. Keep the stock file to go back.</li></ul></details>`;

      <p>Two projects with 16 tracks × 16 patterns, POLY / DRUM / MPE / AFTR tracks, live scale/chord/drum modes, the step sequencer (zoom, pages, selections, warp, loop points, math conditions, roll, chance, uTime, mono edit, note learn, step-rec), automation lanes, pattern mode with sync, follow actions, sections and songs, mixmute, the transpose track (TRSP and match chord), pScale, time signatures, elasticity, the modMatrix and most effects, algorithms, snapshot, undo, recording (countdown, punch-in, looper, overdub/hard rec, multitrack), MIDI file export/import and Web MIDI in/out all work.</p>
      <details><summary>Simplified or not simulated</summary>
        <ul class=&quot;tight&quot;>
          <li>Sounds are stand-ins; CV/Gate outputs play a mono synth; CV inputs, DIN sync, clock sync and pedal are settings only.</li>
          <li>ARPOLY, ENVELOPE and SPRING show their parameters but don't process notes; NRPN, CC pairs and program change lanes aren't sent.</li>
          <li>MPE tracks play like POLY tracks (no per-note expression curves); AFTR notes carry one pressure value rather than a drawn curve.</li>

 up:[&quot;▲&quot;,&quot;Octave up (live, step), next drum lanes, previous patterns in pattern mode, previous automation lane. With a selection: move it up.&quot;,&quot;p. 34, 46&quot;],down:[&quot;▼&quot;,&quot;Octave down, drum lanes 1–8, next patterns, next lane. With a selection: move it down.&quot;,&quot;p. 34, 46&quot;]};
function ctlText(id){if(/^t\d/.test(id)){const i=+id.slice(1);return[`Track ${i+1}${i===15?&quot; (TRSP)&quot;:&quot;&quot;}`,`Press: select track ${i+1}. Hold: its settings (output, channel, input, length, run, trig, PC). 2ND + press: secondary settings (quantize, pTRSP, pSCALE, name, mono edit, instrument definition, MIDI file). Mute + press: mute group. ◀/▶ held: loop start/end on this step position.${i===15?&quot; Track 16 can lead the transposition of the others (pTRSP in the project settings).&quot;:&quot;&quot;}`,&quot;p. 14, 89–93&quot;]}

 if(/^e\d/.test(id)){const j=ENC2SLOT[id],s=slots(view())[j];return[`Encoder ${id.slice(1)}`,s&amp;&amp;s.l?`<b style=&quot;display:inline&quot;>${s.l} = ${s.v}</b>. ${s.tip||&quot;&quot;}`:&quot;Does nothing on this page.&quot;,&quot;p. 14&quot;]}

 return INFO[id]||[id,&quot;&quot;,&quot;&quot;]}
function padTip(c,r){const m=S.ui.mode,T=T_();if(m===&quot;step&quot;){const t=colT(T,c);return T.type===&quot;DRUM&quot;?`Step ${Math.floor(t)+1}, lane ${T.drum[T.dpage*8+r].name}. Press = add/remove, hold = edit.`:`Step ${Math.floor(t)+1}, ${nm(rowPitch(T,r))}. Press = add/remove a note; hold = edit it; hold + tap another pad = set its length; hold two pads = select a range.`}
 if(m===&quot;pattern&quot;)return`Track ${c+1}, pattern ${patAt(r)+1}. Press = launch (SYNC), hold = settings.`;if(m===&quot;autom&quot;)return`Step ${Math.floor(colT(T,c))+1}, value row ${r+1}. Press = place an event, press it again = remove, hold = fine-tune.`;
 if(m===&quot;mix&quot;)return`${r>=4?&quot;proA&quot;:&quot;proB&quot;} track ${c+1}: ${[&quot;MUTE&quot;,&quot;SOLO&quot;,&quot;TOGGLE (hold)&quot;,&quot;REC ARM&quot;][3-(r%4)]}.`;
 if(T.type===&quot;DRUM&quot;){const z=drumZone(T,c,r);return z?`${T.drum[z.lane].name}, velocity ${z.vel}.`:&quot;&quot;}if(T.live.mode===&quot;CHORD&quot;)return r>=3&amp;&amp;c<8&amp;&amp;CHMOD_GRID[7-r][c]!=null?`Modifier: ${CHMODS[CHMOD_GRID[7-r][c]][0]}. 2ND + press to latch.`:r<=1&amp;&amp;c>=4?&quot;Chord degree &quot;+(c-3)+(r?&quot; (octave up)&quot;:&quot;&quot;):&quot;&quot;;return nm(liveNote(T,c,r))}
function showTip(id,e){const[n,d]=ctlText(id);tipHtml(`<b>${n}</b>${d}`,e)}

 if(x+w>innerWidth-8)x=innerWidth-w-8;if(y+h>innerHeight-8)y=e.clientY-h-12;tip.style.left=Math.max(8,x)+&quot;px&quot;;tip.style.top=Math.max(8,y)+&quot;px&quot;}
function hideTip(){$(&quot;#tip&quot;).hidden=true}

const VINFO={live:[&quot;Live mode&quot;,&quot;Play and record with the pads. Encoders set key, hold/relatch, scale colour and scale, velocity and the pad view. ▲▼ = octave.&quot;],step:[&quot;Step mode&quot;,&quot;Piano roll on the pads. Encoders = parameters of new notes, or of the notes you hold. +/– zoom, ◀▶ pages, ▲▼ octave.&quot;],autom:[&quot;Automation mode&quot;,&quot;Draw automation: columns = steps, rows = values. Encoder 1 picks the lane (press it for + ADD / the lane menu).&quot;],pattern:[&quot;Pattern mode&quot;,&quot;Launch patterns per track; sections and songs on the right screen.&quot;],mix:[&quot;Mixmute&quot;,&quot;Rows top to bottom: proA MUTE, SOLO, TOGGLE, REC; then the same for proB.&quot;],fx:[&quot;Effects&quot;,&quot;The track's MIDI effect rack.&quot;],lfo:[&quot;Project LFOs&quot;,&quot;LFO A and B of the project, for the modMatrix.&quot;],assign:[&quot;Assign&quot;,&quot;The 8 encoders as controllers.&quot;],settings:[&quot;Settings&quot;,&quot;Global settings.&quot;],algo:[&quot;Algorithms&quot;,&quot;Offline pattern generators/transformers.&quot;],steprec:[&quot;Step-rec&quot;,&quot;Enter notes one step at a time from the pads, then APPLY.&quot;],monitor:[&quot;MIDI monitor&quot;,&quot;Incoming (left) and outgoing (right) MIDI.&quot;],
 trk:[&quot;Track settings&quot;,&quot;Held track: routing and pattern parameters.&quot;],trk2:[&quot;Secondary track settings&quot;,&quot;Quantize, pTRSP, pSCALE, name, mono edit, instrument definition, MIDI files.&quot;],proj:[&quot;Project settings&quot;,&quot;Scale, transpose, quantize, signature, save/load.&quot;],bpm:[&quot;BPM / elasticity&quot;,&quot;Tempo and per-track speed.&quot;],recset:[&quot;REC settings&quot;,&quot;How recording behaves.&quot;],patp:[&quot;Pattern settings&quot;,&quot;Settings of the held pattern(s).&quot;],lane:[&quot;Drum lane&quot;,&quot;Routing of the held drum lane.&quot;],row:[&quot;Row snap values&quot;,&quot;Values of the automation pad rows.&quot;],ttype:[&quot;Track type&quot;,&quot;POLY, DRUM, MPE or AFTR (3.20).&quot;],lmode:[&quot;Live mode type&quot;,&quot;SCALE or CHORD.&quot;]};

 ${s.some(x=>x.l&amp;&amp;x.l!==&quot;_prog&quot;)?`<div class=&quot;kmap&quot;>${s.map((x,j)=>`<div><b>Encoder ${names[j]}</b>${x.l&amp;&amp;x.l!==&quot;_prog&quot;?`${x.l}: ${x.v}`:&quot;—&quot;}</div>`).join(&quot;&quot;)}</div>`:&quot;&quot;}<p class=&quot;pg&quot;>Hover the screens and pads for details.</p>`;infoSig=v+s.map(x=>x.l+x.v).join()}

/* ================= chapters ================= */
const tb=rows=>`<table class=&quot;t&quot;>${rows.map(r=>`<tr>${r.map((c,j)=>j?`<td>${c}</td>`:`<th>${c}</th>`).join(&quot;&quot;)}</tr>`).join(&quot;&quot;)}</table>`;
const YT=id=>`<p><a href=&quot;https://www.youtube.com/watch?v=${id}&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;>Watch the Squarp tutorial ↗</a></p>`;
const CHAP=[
 [&quot;Sequencer workflow and architecture&quot;,&quot;9–10&quot;,()=>setMode(&quot;pattern&quot;),`<p>Hapax plays two projects at once (<b>proA</b>, <b>proB</b>). Each has 16 tracks; each track has its own inputs, outputs, effect rack and 16 patterns. A pattern is a loop of notes and/or automation with its own length, run mode, effect values and follow actions.</p>${tb([[&quot;Project&quot;,&quot;scale, time signature, mutes/solos, playing patterns, sections and song, TRSP on track 16&quot;],[&quot;Track&quot;,&quot;type (POLY/DRUM/MPE/AFTR), input, output, elasticity, modMatrix + effects, quantize&quot;],[&quot;Pattern&quot;,&quot;length (1 step…32 bars), run mode, trig, PC, zoom, loop points, colour, follow actions, events&quot;]])}`],
 [&quot;Connecting a synth: track input and output&quot;,&quot;11, 90&quot;,()=>{setMode(&quot;step&quot;);holdTrackDemo()},`<p>Hold a track button: OUTPUT port + CHANNEL send everything the track plays (pads, steps, external keyboard) there. INPUT: <b>ALL ACTIVE</b> listens to every port, but only while the track is selected; a named port listens all the time.</p><p>In this simulation every MIDI channel has a stand-in instrument (Virtual studio card). Click <b>MIDI</b> to also send to real gear.</p>`],
 [&quot;Play / stop&quot;,&quot;12&quot;,()=>{},`<p>play starts; while playing it restarts all tracks. stop: 1st press stops (MIDI stop, default automation values), 2nd all notes off + pattern PCs, 3rd all sound off, 4th resends assign values and clears the MIDI cache.</p>`],
 [&quot;Projects, save and load&quot;,&quot;13, proj. chapter&quot;,()=>{},`<p>Hold proA or proB: the right screen has SAVE, SAVE AS, NEW, LOAD (here also LOAD DEMO). Name a project <b>DEFAULT</b> to make it the template for NEW. Projects you save here live in this browser.</p>`],
 [&quot;Select and configure a track&quot;,&quot;14&quot;,()=>{},`<p>Press a track to select it (bright white). Hold it for track settings. 2ND + press for the secondary settings. The 8 encoders always control the left screen, the main encoder the right screen. Hold an encoder to reset a parameter; hold 2ND and turn to scroll faster.</p>`],
 [&quot;Upper and lower bars&quot;,&quot;15&quot;,()=>setMode(&quot;step&quot;),`<p>Upper bar: pattern, track name, mute icon, MIDI meters, project name. Lower bar: position (bar.beat), number of pages, TRSP amount.</p>`],
 [&quot;Live recording&quot;,&quot;16, 29–31&quot;,()=>{setMode(&quot;live&quot;);S.ui.page=&quot;recset&quot;},`<p>Press rec while playing to record the selected track (or the armed tracks of Mixmute). REC settings (2ND + settings): ${tb([[&quot;LEARN&quot;,&quot;note learn in Step mode&quot;],[&quot;NOTES&quot;,&quot;HARD REC replaces, OVERDUB merges&quot;],[&quot;COUNTDOWN&quot;,&quot;1–4 bars (arm rec first)&quot;],[&quot;METRONOME&quot;,&quot;click while recording&quot;],[&quot;PUNCH IN&quot;,&quot;waits for the first note&quot;],[&quot;LOOPER&quot;,&quot;on an empty track: rec starts, rec again sets the length&quot;],[&quot;REC OFF&quot;,&quot;stop at pattern end&quot;],[&quot;QUANTIZE&quot;,&quot;destructive&quot;]])}`+YT(&quot;olx8ZA2Sq_o&quot;)],
 [&quot;Step mode essentials&quot;,&quot;17, 44–47&quot;,()=>setMode(&quot;step&quot;),`<p>Press a pad to add a note, press again to delete. The left screen holds the defaults new notes inherit. NOTE/OCTAVE scroll the piano roll (bottom row). Hold a note to edit it; hold an empty pad and turn an encoder to create one with that value.</p>`],
 [&quot;Pattern length&quot;,&quot;18, 51&quot;,()=>{},`<p>Hold a track: LENGTH (bars; hold + turn = steps, 1–512). 2ND + +/– doubles/halves; 2ND + ▶/◀ doubles with a copy of the events / halves and deletes.</p>`],
 [&quot;Mute tracks and projects&quot;,&quot;18–19&quot;,()=>{},`<p>Hold mute, press tracks (they flash), release mute: all toggled together. 2ND + mute + track = instant. Hold mute + proA/proB: project (un)mute in sync at the end of the bar (PROJECT SYNC setting).</p>`],
 [&quot;Delete tracks and patterns&quot;,&quot;19&quot;,()=>{},`<p>delete + track = reset the track; delete + step = notes of the pattern; delete + autom = its automation; delete + a pattern pad in Pattern mode = that pattern.</p>`],
 [&quot;Track types&quot;,&quot;20&quot;,()=>{setMode(&quot;step&quot;)},`<p>Hold step and turn the main encoder: <b>POLY</b> (synths), <b>DRUM</b> (16 lanes, each with its own note/channel), <b>MPE</b> (per-note pitch/timbre/pressure), and since 3.20 <b>AFTR</b> (polyphonic aftertouch on one channel, any synth).</p>`],
 [&quot;Quantize&quot;,&quot;20–21, 109&quot;,()=>{S.ui.page=&quot;trk2&quot;},`<p>2ND + track: QUANTIZE (–, 1/64, 1/32, 1/24, 1/16) and STRENGTH. It's non-destructive. pQUANT in the project overrides it for all tracks. For destructive: REC settings QUANTIZE, or select notes and hold uTIME.</p>`],
 [&quot;Project scale (pScale)&quot;,&quot;22, 54&quot;,()=>{},`<p>Hold proA/proB: pSCALE ON, KEY, COLOR, SCALE, STICK. All tracks (except drums, and tracks with pSCALE off in 2ND + track) are constrained. The step piano roll then only shows in-scale notes, octave by octave.</p>`+YT(&quot;J7i69JogkPE&quot;)],
 [&quot;Undo / redo and snapshot&quot;,&quot;23–24&quot;,()=>{},`<p>undo; 2ND + undo = redo. Hold snapshot to capture, press to flip between captured (red) and working (green).</p>`+YT(&quot;NMZk7XgcP54&quot;)],
 [&quot;Assign&quot;,&quot;25&quot;,()=>{S.ui.sub=&quot;assign&quot;},`<p>2ND + fill: each encoder sends a MIDI CC, CV or effect parameter of your choice (press it to choose). It counts as an external controller, so with REC on it records automation.</p>`+YT(&quot;AhJ5KF67iac&quot;)],
 [&quot;Tempo, tap and elasticity&quot;,&quot;26&quot;,()=>{S.ui.page=&quot;bpm&quot;},`<p>bpm opens the popup. 2ND + bpm repeatedly = tap. ELASTICITY sets one track's speed: 50% = half, 200% = double, 100.5% = slowly drifts out of phase (Steve Reich's Piano Phase). Try the PIANO PHASE demo.</p>`+YT(&quot;ea0OKpoAdYA&quot;)],
 [&quot;Connectivity&quot;,&quot;27–28&quot;,()=>{},`<p>Inputs: MIDI A, B (TRS), USB host, USB device = 64 channels, plus 2 CV inputs. Outputs: MIDI A–D, USB host, USB device = 96 channels, plus 4 CV/Gate pairs. USB ports carry 16 virtual cables each (3.00).</p>`],
 [&quot;Livemode Scale&quot;,&quot;33–36&quot;,()=>{setMode(&quot;live&quot;);T_().live.mode=&quot;SCALE&quot;},`<p>An isomorphic keyboard: right = next note, up = JUMP notes higher (default 3 semitones). With a scale, steps are scale degrees. Encoders: KEY, PLAY (HOLD / RELATCH), COLOR, SCALE, VELOCITY, VIEW (press for JUMP). 72 scales in colour families (scales of one colour share 3rd/7th). Chord recognition under the mini keyboard.</p>`+YT(&quot;4_Gqy6OJkY8&quot;)],
 [&quot;Livemode Chord&quot;,&quot;36–41&quot;,()=>{setMode(&quot;live&quot;);T_().live.mode=&quot;CHORD&quot;},`<p>Hold live + turn the main encoder. Bottom rows (right hand): one pad per scale degree, harmonised by stacking thirds. Left area: modifiers (octave, spread, rotate, voicings, extensions, bass drops, transpose, AUTO INVERSION in red). Up to 8 stack, in order; 2ND + pad latches one.</p>`+YT(&quot;Y1Er_OtbhSA&quot;)],
 [&quot;Livemode Drum&quot;,&quot;42–43&quot;,()=>{setMode(&quot;live&quot;);setType(T_(),&quot;DRUM&quot;)},`<p>On a DRUM track the pads become zones (8 lanes × 16 velocities by default; 3.10 adds 8-, 4- and 1-velocity layouts in Settings → Misc → Live Drum Pads). Encoders = each lane's output note; hold + turn = channel.</p>`+YT(&quot;g4UY_zFv7Pc&quot;)],
 [&quot;Piano roll, navigation&quot;,&quot;45, 51–52&quot;,()=>setMode(&quot;step&quot;),`<p>The right screen shows the whole pattern; the grey viewport is what the pads show. Zooms /16 … ×48 (+/–), triplet zooms (+ and – together). Pages with ◀▶. Press step to focus on the nearest note.</p>`+YT(&quot;B1Ad7jgngYQ&quot;)],
 [&quot;Note parameters&quot;,&quot;46–48&quot;,()=>setMode(&quot;step&quot;),`${tb([[&quot;NOTE / OCT&quot;,&quot;C0 (0) … G10 (127)&quot;],[&quot;VELOCITY&quot;,&quot;0–127&quot;],[&quot;LENGTH&quot;,&quot;1/16 … INFINITY (hold + turn: ticks)&quot;],[&quot;uTIME&quot;,&quot;–50% … +50% of a step&quot;],[&quot;CHANCE&quot;,&quot;0–100%&quot;],[&quot;ROLL&quot;,&quot;ratchet 1/8 … 1/256&quot;],[&quot;MATH&quot;,&quot;conditional trig&quot;]])}<p>Two-finger length: hold a pad, tap another. Hold a note pad = copy its parameters as the defaults (HOLD STEP CAPTURE).</p>`],
 [&quot;Selections, copy/paste, warp&quot;,&quot;48–51&quot;,()=>setMode(&quot;step&quot;),`<p>Hold two pads = a range (all pitches; add 2ND to constrain). Hold all = everything; hold a row = that note. Then: encoders edit, arrows move, mute, delete, copy; hold paste + pad pastes (2ND = at that pitch). + / – warp: 3 steps → 4 = triplets, 5 → 4 = quintuplets (or ROTATE, Settings → SELECT +/-).</p>`],
 [&quot;Loop points&quot;,&quot;53&quot;,()=>setMode(&quot;step&quot;),`<p>Hold ◀ and press a track button (= a step position of the page): loop start. Hold ▶ + track: loop end. ◀ + ▶ together: remove. Each pattern has its own.</p>`+YT(&quot;w5gsc5uHkoQ&quot;)],
 [&quot;Mono edit and note learn&quot;,&quot;55–56&quot;,()=>setMode(&quot;step&quot;),`<p>2ND + step: MONO EDIT, adding a note removes the others at that step. NOTE LEARN: play a note or chord (pads or keyboard), press the NOTE encoder, then press pads to drop the learned chord in.</p>`],
 [&quot;Math (conditional trigs)&quot;,&quot;56–58&quot;,()=>setMode(&quot;step&quot;),`${tb([[&quot;FILL / !FILL&quot;,&quot;only while fill is held / not held&quot;],[&quot;1ST / !1ST&quot;,&quot;first playback of the pattern&quot;],[&quot;PRE / !PRE&quot;,&quot;last condition of the track was true&quot;],[&quot;SYNC&quot;,&quot;on the first step of a beat&quot;],[&quot;NT<n&quot;,&quot;fewer than n notes playing (project)&quot;],[&quot;PS<n / PB<n&quot;,&quot;last step / beat played fewer than n notes&quot;],[&quot;X:Y&quot;,&quot;plays the X-th time every Y loops&quot;],[&quot;NO FX&quot;,&quot;bypasses effects, pScale and pTRSP&quot;]])}`],
 [&quot;Step-rec mode&quot;,&quot;58–59&quot;,()=>{},`<p>Press live and step together. Play notes or chords (released together = one step), add REST and TIE with the encoders, then APPLY. RATE sets the grid; MONO and MONO + LEGATO for monosynths.</p>`],
 [&quot;Drum tracks: lanes&quot;,&quot;60–61&quot;,()=>{setMode(&quot;step&quot;);setType(T_(),&quot;DRUM&quot;)},`<p>Hold a row button: INPUT (LINK = same as output), OUTPUT note, CHANNEL (track channel, any channel, or a Gate/CV output for triggers and accents). 16 lanes since 3.10 (▲▼). 2ND + row: velocity view.</p>`+YT(&quot;g4UY_zFv7Pc&quot;)],
 [&quot;Automation&quot;,&quot;62–72&quot;,()=>setMode(&quot;autom&quot;),`<p>Encoder 1: lane (+ ADD, then a destination). Pads: columns = steps, rows = values (each row's value can be set by holding the row, 3.10). INTERPOL, DEFAULT, PING (2ND + press, 3.10). Lane menu: mute, clear, delete, change destination, copy/paste, max rate, lock. With rec on, incoming CC/PB/AT create lanes automatically.</p>`+YT(&quot;l6fR5ir1lIg&quot;)],
 [&quot;Patterns: launch, sync, mute&quot;,&quot;73–76&quot;,()=>setMode(&quot;pattern&quot;),`<p>Each column is a track. Press a pad to launch at the next SYNC (instant, 1/16, beat, bars, PTRN = end of the pattern, TRACK n = end of track n's pattern, 3.00). Row buttons launch a row. mute + pad mutes a pattern.</p>`],
 [&quot;Pattern parameters and PC&quot;,&quot;76–80&quot;,()=>setMode(&quot;pattern&quot;),`<p>Hold a pattern pad: PC (MSB/LSB in the popup), TRIG (FREE keeps the position, RESTART), COLOR, LENGTH, RUN (reverse, ping-pong, random bar/beat/1/16), FOLLOW LEN, FOLLOW 1, FOLLOW 2.</p>`],
 [&quot;Follow actions&quot;,&quot;81–83&quot;,()=>setMode(&quot;pattern&quot;),`<p>At the end of a pattern (or FOLLOW LEN): STOP, NEXT, PREVIOUS, ANY, OTHER, FIRST, LAST, RSTR. They work inside a contiguous group of patterns that have actions. Press FOLLOW 1 for its probability; FOLLOW 2 gets the remainder.</p>`+YT(&quot;lOTs0Zrqeeg&quot;)],
 [&quot;Sections and songs&quot;,&quot;84–88&quot;,()=>setMode(&quot;pattern&quot;),`<p>Right screen, main encoder: + SAVE SECTION stores which pattern each track plays. Press a section to launch it (in sync); 2ND + press for its menu. Press pattern for the SONG tab: add sections with durations, then MODE = PLAY SONG or LOOP SONG and press play.</p>`+YT(&quot;atZpXI0-4qc&quot;)],
 [&quot;Copy, paste, swap tracks&quot;,&quot;93&quot;,()=>{},`<p>copy + track, paste + track. Hold a track + ◀/▶ to swap it with its neighbour (the TRSP role stays with the track that has it).</p>`],
 [&quot;Instrument definitions&quot;,&quot;93–95&quot;,()=>{S.ui.page=&quot;trk2&quot;},`<p>Text files in the HAPAX folder: name CCs, set ports/channels, drum lanes, PC names, empty automation lanes. 2ND + track → INSTRUM. A few examples are built in here.</p>`],
 [&quot;MIDI import / export&quot;,&quot;95–99&quot;,()=>{S.ui.page=&quot;trk2&quot;},`<p>2ND + track → MIDI FILE: EXPORT saves the pattern as a type-1 .mid (notes + automation tracks); IMPORT replaces the pattern with a track of a .mid (type 0/1, up to 32 bars). Drum patterns map lane 1 from note 36 on export.</p>`+YT(&quot;Ri-F0EjGWDE&quot;)],
 [&quot;Effects: rack, locking, quick lanes&quot;,&quot;100–103&quot;,()=>{S.ui.sub=&quot;fx&quot;},`<p>effects: the rack. The modMatrix is always first; then up to 8 effects, in order. Main encoder press: add / TOGGLE, DELETE, REPLACE, COPY, PASTE; hold + turn = move. 2ND + press a parameter encoder: lock its value to the pattern. Hold rec + touch a parameter: instant automation lane.</p>`+YT(&quot;kw8zrQjzpoc&quot;)],
 [&quot;The effects&quot;,&quot;104–109 + online&quot;,()=>{S.ui.sub=&quot;fx&quot;},`${tb(FXLIST.map(k=>[FXDEF[k].n,FXDEF[k].d]))}<p>· = parameters shown, not processed by the simulation.</p>`],
 [&quot;modMatrix&quot;,&quot;online FX chapter&quot;,()=>{S.ui.sub=&quot;fx&quot;;S.ui.fxSel=0},`<p>Sources: CC 0–119, pitchbend, aftertouch, CV in 1/2, project LFO A/B, KEYTRACK, VELOCITY, FILL. Destinations: CC, pitchbend, aftertouch, PC, velocity, NRPN, CC pair, CV out, any effect parameter. DEPTH, OFFSET, POLARITY, CONSUME.</p>`+YT(&quot;vngcBiTkJjk&quot;)],
 [&quot;Project LFOs&quot;,&quot;108&quot;,()=>{S.ui.sub=&quot;lfo&quot;},`<p>2ND + effects. Two LFOs per project: SINE, TRIANGLE, RAMP, SQUARE, RANDOM, FLAT (3.10), sync on/off, rate 64 bars … 1/128, phase.</p>`],
 [&quot;Algorithms&quot;,&quot;110–116&quot;,()=>{setMode(&quot;step&quot;);S.ui.sub=&quot;algo&quot;},`${tb([[&quot;GENERATOR&quot;,&quot;new random notes on a grid, with pitch/velocity/length ranges, density, polyphony&quot;],[&quot;CURVES&quot;,&quot;shape velocity, keys, length, chance… with a waveform&quot;],[&quot;SHUFFLE&quot;,&quot;shuffle notes, parameters, or segments&quot;],[&quot;SYMMETRY&quot;,&quot;mirror in time or pitch, keep or replace&quot;],[&quot;EVERY N&quot;,&quot;drum accents/ghosts every N&quot;]])}`+YT(&quot;hdfoq2Z3mDU&quot;)],
 [&quot;Mixmute&quot;,&quot;117–121&quot;,()=>setMode(&quot;mix&quot;),`<p>press mute. 32 tracks at once: MUTE, SOLO (hold one solo and press others for several), TOGGLE (momentary), REC (arm several tracks for multitrack recording, then press rec from any mode).</p>`+YT(&quot;bgPseYG1PYU&quot;)],
 [&quot;Dual projects and transitions&quot;,&quot;project chapter&quot;,()=>{},`<p>Load the next project into proB while proA plays (it comes in muted). Prepare its mutes, then mute + proB to bring it in at the end of the bar, mute + proA to take A out. Different tempo: you choose to keep or update.</p>`+YT(&quot;IQZ9i-ynYn8&quot;)],
 [&quot;Transpose track (TRSP / match chord)&quot;,&quot;project chapter&quot;,()=>{},`<p>Hold proA: TR16 TRSP. <b>TRSP</b>: track 16's notes transpose tracks 1–15 (C5 = +0, Settings → TRANSPOSE ROOT). <b>CHRD</b>: their notes are pulled into the chord track 16 plays. TRANSPOSE SYNC delays the change to the beat/bar. Drum tracks never follow; 2ND + track → pTRSP OFF excludes a track.</p>`+YT(&quot;ZIlI2B1iduE&quot;)],
 [&quot;Time signatures&quot;,&quot;project chapter&quot;,()=>{},`<p>Hold proA: pSIGNATURE. Turn = beats per bar, hold + turn = beat unit. With SPLIT BARS on, each bar starts a new page (7/4 = 28 steps over 2 pages).</p>`],
 [&quot;MPE&quot;,&quot;122–129&quot;,()=>{},`<p>MPE tracks record per-note pitchbend, timbre (CC74) and pressure from an MPE controller and keep them with each note. Output zones (lower/upper), up to 4 MPE tracks per output, virtual cables, MCM. The simulation plays MPE tracks like POLY tracks.</p>`],
 [&quot;Settings&quot;,&quot;130–149&quot;,()=>{S.ui.sub=&quot;settings&quot;},`<p>Sync in (clock source, start/stop, CV reset, CV clock rate), sync out, misc (follow playhead, hold step capture, transpose root/sync, restart sync, project sync, pattern trig, sustain, note chasing, unison, select +/-, split bars, mute group, hold time, background RGB, live drum pads…), CV/gate + pedal, MIDI in, MIDI thru, compensation, palette, MIDI monitor.</p>`],
 [&quot;What changed since the manual (3.20–3.22)&quot;,&quot;firmware page&quot;,()=>{setMode(&quot;live&quot;);setType(T_(),&quot;AFTR&quot;)},`<p>The manual covers hapaxOS 3.10. Since then:</p><ul class=&quot;tight&quot;><li><b>3.20</b>: new <b>AFTR</b> track type (poly aftertouch on one channel; every note keeps a pressure curve that moves with it). Poly aftertouch passes through every track type. Channel aftertouch on an AFTR track applies to all held notes. Instrument definitions accept TYPE = POLYAT/AFTR. MIDI monitor shows poly AT. Sync in: CV CLOCK RATE up to 96 ppqn, CLOCK TIMEOUT (fall back to internal clock), CV FOLLOW TEMPO. Faster automation playback. Projects saved by 3.20 don't open in 3.10.</li><li><b>3.21</b>: AFTR hotfixes (channel routing, MCM hidden).</li><li><b>3.22</b>: AFTR live mode gets a <b>PRESSUR</b> encoder (sent as poly AT right after each note) and a pressure-aware mini keyboard; in Step mode + cycles VELOCITY/PRESSUR only, notes placed by hand now send their pressure; ALGO says “NOT AVAILABLE FOR AFTR”.</li></ul>`]];

<header>
  <h1>KeyStep Pro interactive manual</h1>
  <p class=&quot;sub&quot;>Unofficial, playable recreation of the Arturia KeyStep Pro (firmware 2.5), built from the 2.5.1 user manual, the MIDI Control Center device definition and a reverse-engineering study of firmware 2.5.20. All sounds are synthesized stand-ins. The Device tools tab talks to a real KeyStep Pro over Web MIDI, or to this simulation. Not affiliated with Arturia.</p>
</header>

</div>

        <h2>The manual, chapter by chapter</h2>
        <p class=&quot;pg&quot;>Show jumps the simulation to that part of the KeyStep Pro and explains it here.</p>
        <ul class=&quot;chap&quot; id=&quot;chapList&quot;></ul>
      </div>
      <div class=&quot;card&quot;>
        <h2>About this simulation</h2>
        <p>Four tracks with 16 patterns of up to 64 steps (up to 16 notes per step), the drum sequencer with 24 lanes, three arpeggiators, scales and user scales, chord mode, transpose (with groups and latch), quick edit, step edit, step and real-time recording, overdub, the Shift step functions, step skip, pages, chains, scenes, projects with save/copy/erase/recall, the looper strip, control mode, the Utility menu, tempo, swing, metronome and Web MIDI in/out all work.</p>
        <details><summary>Firmware notes</summary>
          <p class=&quot;pg&quot;>Some behaviour here follows the decoded 2.5.20 firmware rather than the manual. Those places are marked with a blue “Firmware” note in the help text.</p>
        </details>
        <details><summary>Simplified or not simulated</summary>
          <ul class=&quot;tight&quot;>
            <li>Sounds are stand-ins; CV/Gate outputs, clock in/out, sync and pedal are settings only.</li>
            <li>Arpeggiator randomness, keyboard splits and the Program Change assign page are simplified.</li>
            <li>Copy/paste of individual notes inside a step and the Chroma colour sets are not simulated.</li>
            <li>Multi-touch is replaced by holding with right-click (or long-press on touch) and then pressing other controls.</li>
          </ul>
        </details>
        <p class=&quot;pg&quot;>Sources: KeyStep Pro user manual 2.5.1 (14 March 2024), MIDI Control Center device file, firmware 2.5.20 reverse-engineering notes. Section numbers refer to the manual.</p>
      </div>
    </div>
    <div id=&quot;paneDev&quot; hidden></div>
  </div>
</main>

 {const p=P[4],cp=proj().ctrl.pats[proj().ctrl.cur];let guard=0;while(p.next<la&amp;&amp;guard++<64){playCtrlStep(cp,p);p.next+=60/bpm()/4}}

function playTrackStep(t,time){const p=P[t],pat=curPat(t);
 if(S.looper&amp;&amp;S.looper.start[t]!=null){const L=S.looper,len=Math.max(1,Math.round(L.beats*96/stepTicks(pat)));if(p.cnt-L.start[t]>=len){p.idx=L.idx[t];p.cnt=L.start[t]}}

/* ---------- arpeggiators (run whenever notes are held, even when stopped) ---------- */
const ARP=[0,1,2,3].map(()=>({next:0,i:0,seq:[],dirn:1,running:false}));

function arpSeq(t){const pat=curPat(t),base=arpNotes(t).slice();if(!base.length)return [];

 for(const o of octs)for(const n of src)list.push({p:n.p+12*o,v:n.v});
 if(mode===&quot;Down&quot;)list.reverse();
 if(mode===&quot;Exclu&quot;&amp;&amp;list.length>2)list=list.concat(list.slice(1,-1).reverse());

 const last=S.playIdx&amp;&amp;S.playIdx[t];let idx,ts;if(!last){idx=0;ts=0}else{const rel=(time-last.time)/dur;let k=Math.round(rel);ts=Math.round((rel-k)*100);idx=((last.idx+k)%pat.len+pat.len)%pat.len}

/* ---------- step edits &amp; shift functions ---------- */

function shiftStep(i){const pat=curPat(),name=STEPFN[i],t=S.cur,dr=isDrum();

 if(S.control&amp;&amp;[2,3,4,10].includes(i)){const cp=proj().ctrl.pats[proj().ctrl.cur],a=cp.st.slice(0,cp.len);let b;
  if(i===2)b=[...a.slice(1),a[0]];else if(i===3)b=[a[cp.len-1],...a.slice(0,-1)];else if(i===4)b=a.slice().reverse();else b=a.slice().sort(()=>Math.random()-.5);b.forEach((s,k)=>cp.st[k]=s);msg(name);emit(&quot;shiftfn:&quot;+name);dirty();return}

const SHOW={
 trackSettings(){S.cur=1;openMenu(MENU_TS());return &quot;<p>Firmware 2.5 added a per-track settings page: <b>Shift + Track button</b>. It holds MIDI Channel IN/OUT, Program Change Send and Assign, and Fixed Velocity. Transpose Latch lives in <b>Utility &amp;gt; Misc</b>.</p><div class='fw'><b>Firmware:</b> PC Send and Fixed Velocity are global settings 142–146 and 154–158 (track 1 has separate Seq and Drum entries). MCC does not list them; the Device tools tab can read and set them.</div>&quot;},
 recordBasics(){S.cur=1;trk(1).mode=&quot;seq&quot;;return &quot;<p>Three ways to fill a pattern: <b>Quick Record</b> (hold a step and play keys, Record and Step Edit off), <b>Step Record</b> (press Record while stopped; each key press fills a step and advances; Tie/Rest = rest) and <b>Real-time Record</b> (hold Record, press Play). Overdub decides whether notes add to or replace a step. Shift + Record toggles quantized recording.</p>&quot;},
 arpBasics(){S.cur=2;trk(2).mode=&quot;arp&quot;;return &quot;<p>Tracks 2–4 have arpeggiators. Press <b>Arp</b>, hold a chord, and it plays even when the sequencer is stopped. <b>Hold</b> latches it; while one key is held you can add notes (up to 16). Shift + the Arp Pattern keys pick Up, Down, Exclu, Inclu, Rand, Order or Poly; Shift + Arp Octave −1…+3 sets the range. Gate, Velocity (bipolar), Time Shift and Randomness act on the whole arpeggio.</p>&quot;},
 scaleBasics(){S.cur=1;return &quot;<p>Shift + a Scale key (Chrom, Major, Minor, Dorian, Mixo, H.Min, Blues, User 1, User 2) sets the scale of the current pattern. The keyboard, the sequence and the arpeggio of that track all play in the scale. Shift + Root, then a key in the lowest octave, sets the root. Shift + User 1/2 lets you toggle notes in the lowest octave to build your own scale.</p><div class='fw'><b>Firmware:</b> the scale is a 12-bit mask; out-of-scale notes snap to the nearest scale note and ties snap <b>down</b> (in C major C# plays C, F# plays F). The masks are Major 0xAB5, Minor 0x5AD (natural minor), Dorian 0x6AD, Mixolydian 0x6B5, Harmonic minor 0x9AD (C D Eb F G Ab B), Blues 0x4E9. Quantizing happens at play time, so recorded steps keep their raw pitch.</div>&quot;},
 tempo(){return &quot;<p>Tempo 30–240 BPM (Shift = fine, 0.01 BPM). Tap Tempo: tap at least twice. Swing 50–75% for all tracks; Shift + Swing sets an offset for the selected track. Shift + step 15 switches between the project tempo and a global tempo.</p>&quot;},
 encoders(){S.cur=1;return &quot;<p>The five encoders edit Pitch, Gate, Velocity, Time Shift and Randomness. With no step held they set the <b>track defaults</b> used for new notes. Hold a step (or select it in Step Edit) to edit that step. Shift + turn offsets every step of the pattern.</p>&quot;},
 looper(){return &quot;<p>Touch the looper strip while playing to loop all tracks from that moment: 1/4 at the left is the longest loop, 1/32 at the right the shortest. Shift + touch disables or enables the strip.</p>&quot;},
 shiftFns(){return &quot;<p>Hold <b>Shift</b>: the LEDs above the keys show what is active (sequence direction, mono/poly, arp pattern and octave, time division, scale, CV routing). Shift + a step runs the blue step functions: Clr Ptn, Clr Steps, Nudge, Invert, Semi Up/Down (scale-aware), Oct Up/Down, Qnt 50%/100%, Rand Order/Notes/Oct, Global BPM, Wait Load.</p>&quot;},
 seqLength(){return &quot;<p>Lst Step + a step sets the length within the viewed page; Lst Step + 16/32/48/64 sets it in pages. Shift + a page button extends the pattern by copying page 1 there. Shift + Lst Step toggles Follow. Shift + Mono/Poly keys set whether a step plays all its notes or only the lowest; Shift + Fwd/Rand/Walk sets the direction.</p>&quot;},
 stepEdit(){S.cur=1;S.stepEdit=true;return &quot;<p><b>Step Edit</b> on: press a step to select it (it blinks). Play keys to replace its notes, or with Overdub on to add notes. Encoders edit the step; Tie/Rest clears it. When the sequencer is stopped, pressing a step plays it (step listen). <b>Quick Edit</b> (Step Edit off): press steps to toggle them, or hold one and play keys / turn encoders.</p>&quot;},
 copyPaste(){return &quot;<p>Copy + steps, then Paste + a step. Copy + a page button, then Paste + another page. Erase + steps or a page. Copy/Paste/Erase + Pattern opens pattern mode: press steps to pick patterns. Shift + Exit undoes the last paste or erase.</p>&quot;},
 saving(){return &quot;<p>Edits live in working memory. Hold <b>Save</b>: unsaved patterns of the track show red, saved ones blue. Save + step saves that pattern; Save + Track button saves the whole track; Save + Project saves everything (confirm with the encoder). Shift + Save reloads the current pattern.</p>&quot;},
 drum(){trk(0).mode=&quot;drum&quot;;S.cur=0;return &quot;<p>Track 1 → Drum: 24 lanes on the lowest 24 keys. Press a key to select (and hear) a lane, then press steps to toggle hits. Hold the Drum button and press a key to select a lane silently. Hold Mute + a key to mute lanes; Shift + Drum unmutes all. Shift + Poly lets each lane have its own length (Lst Step + step while a lane is selected).</p>&quot;},
 chordMode(){S.cur=2;return &quot;<p>Hold <b>Shift + Tie/Rest</b> and play a chord (or play it legato): its intervals from the first note are stored. Then any key plays that chord. Shift + Tie/Rest turns chord mode off and on again; the shape stays stored. One chord per track.</p><div class='fw'><b>Firmware:</b> each chord note is snapped through the scale map individually, so a shape becomes diatonic in a scale. The shape and chord-mode flag are part of the track data that Save Project writes, so a saved chord survives a power cycle even though the manual says it doesn't.</div>&quot;},
 projects(){return &quot;<p>16 projects. Hold Project + a step to load one (or hold Project and turn the encoder). Save + Project, Copy + Project (to the next slot) and Erase + Project all ask for confirmation: push the selection encoder. Hold Project and press Shift to recall the saved version from flash.</p><div class='fw'><b>Firmware:</b> all 16 projects are loaded into RAM at boot and edits stay in RAM until saved. At “Save Project / Confirm ?”, a step pad does <b>not</b> confirm: it loads that project and discards the edits. The simulation reproduces this.</div>&quot;},
 tracks(){return &quot;<p>Mute a track with its Mute button; Shift + Mute solos it (exclusive). Hold two track buttons and press a key to split the keyboard (first button = upper part). Press the two track buttons again to remove the split.</p>&quot;},
 patterns(){return &quot;<p>16 patterns per track. Use the track arrows, or hold Pattern + a step. With Wait Load on (Shift + step 16) the change happens at the end of the current pattern; the track display blinks the pending number.</p>&quot;},
 arranging(){return &quot;<p><b>Chain</b>: hold Chain and press steps in order (up to 16). <b>Scene</b>: Save + Scene + step stores the pattern, chain and mute of all tracks; Scene + step loads it. <b>Step skip</b>: hold a step and press page buttons to skip it on those pages/bars.</p>&quot;},
 controlMode(){S.cur=3;return &quot;<p>Press <b>Control</b>: the selected track becomes the Live Track and its button blinks. The encoders send their CC (Utility &amp;gt; Controller &amp;gt; Knob 1–5). In Step Edit, select a step and turn an encoder to store a value; record while playing to capture moves. Erase + turn clears an encoder's automation.</p>&quot;},
 utility(){openMenu(MENU());return &quot;<p>Shift + Project opens the Utility menu: turn the selection encoder to move, push to enter or edit, Exit to go back. Settings are global and saved when you leave.</p><div class='fw'><b>Firmware:</b> every Utility setting is one of 158 global IDs, readable and writable over SysEx. Misc also has Brightness (ID 152) and Transpose Latch (ID 153, stored inverted).</div>&quot;},
 deviceTools(){selectTab(&quot;dev&quot;);return &quot;<p>The Device tools tab sends SysEx to a real KeyStep Pro through Web MIDI, or to this simulation. It only contains features already tested on hardware.</p>&quot;},
};

 li.querySelector(&quot;button&quot;).onclick=()=>{const html=SHOW[fn]();$(&quot;#info&quot;).innerHTML=`<div class=&quot;crumb&quot;>Manual <b>${sec}</b></div><h2>${t}</h2>${html}`;dirty();$(&quot;#info&quot;).scrollIntoView({block:&quot;nearest&quot;})};ul.appendChild(li)})}
